<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--surface:#141821;--raised:#1b2030;--line:#252b3b;--tx:#eef1f6;--mu:#8791a5;--ready:#34d399;--cd:#f87171;--soon:#fbbf24;--ac:#7c9cff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#1a2140 0,var(--bg) 70%) no-repeat,var(--bg);color:var(--tx);font:400 15px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:9px 14px;font-weight:500;transition:background .15s,border-color .15s}
button:hover{border-color:#3a4260;background:#222942}
button:focus-visible,input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.top .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--mu);font-size:14px}
.pill b{color:var(--tx);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.dot.on{background:var(--ready);box-shadow:0 0 8px var(--ready)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.card{--c:var(--ready);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s}
.card[data-s=cd]{--c:var(--cd)}
.card[data-s=soon]{--c:var(--soon)}
.card[data-s=ready]{border-color:#1f4d41}
.card header{display:flex;justify-content:space-between;align-items:center}
.card h2{margin:0;font-size:17px;font-weight:700}
kbd{font:600 12px Inter,sans-serif;color:var(--mu);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.ring{position:relative;width:148px;height:148px;margin:0 auto}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.trk{stroke:var(--raised)}
.val{stroke:var(--c);stroke-dasharray:276.46;transition:stroke-dashoffset .3s linear,stroke .2s}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid strong{font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.1}
.mid span{font-size:12.5px;color:var(--mu)}
.use{width:100%;padding:11px;font-weight:600;background:var(--c);border-color:var(--c);color:#0b0d12}
.use:hover{background:var(--c);filter:brightness(1.1)}
.card[data-s=cd] .use,.card[data-s=soon] .use{background:var(--raised);border-color:var(--line);color:var(--tx)}
.card footer{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--mu)}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw i{width:34px;height:20px;border-radius:99px;background:var(--raised);border:1px solid var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mu);transition:transform .15s,background .15s}
.sw input:checked+i{background:#27345f;border-color:var(--ac)}
.sw input:checked+i::after{transform:translateX(14px);background:var(--ac)}
.undo{padding:4px 10px;border-radius:8px;font-size:15px}
.hint{color:var(--mu);font-size:13.5px;text-align:center;margin-top:24px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:10px}.ring{width:120px;height:120px}.mid strong{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Flash Tracker</div>
    <div class="r">
      <div class="pill" id="net"><i class="dot"></i>Verbinde …</div>
      <button id="copy">Link kopieren</button>
      <button id="resetall">Alle zurücksetzen</button>
      <button id="newsess">Neue Session</button>
    </div>
  </div>

  <main class="grid" id="grid"></main>

  <p class="hint">Tasten 1–5: Flash benutzt · Umschalt + 1–5: Cosmic Insight an/aus</p>
</div>

<script>
const ROLES=[['top','Top'],['jgl','Jungle'],['mid','Mid'],['adc','ADC'],['sup','Support']];
const CD=300, CD_INS=250, SOON=30, RING=276.46;

// ---------- Zustand ----------
// ready = lokaler Zeitpunkt (ms), an dem der Flash wieder verfügbar ist
const players={};
ROLES.forEach(([id])=>players[id]={ins:false,ready:null,ts:0});
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
// Übertragen wird die Restzeit, nicht die Uhrzeit – so spielen unterschiedliche Geräteuhren keine Rolle
const toWire=p=>({ins:p.ins,rem:p.ready===null?null:(p.ready-Date.now())/1000,ts:p.ts});

// ---------- Netzwerk (Trystero, Peer-to-Peer, kein eigener Server) ----------
const $=id=>document.getElementById(id);
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
let code=location.hash.slice(1)||rnd();
history.replaceState(null,'','#'+code);
let sPlayer=null,sFull=null,room=null;

function netStatus(offline){
  if(offline){$('net').innerHTML='<i class="dot"></i>Offline – kein Sync';return}
  const n=room?Object.keys(room.getPeers()).length:0;
  $('net').innerHTML='<i class="dot on"></i>Session <b>'+code+'</b> · '+(n+1)+' verbunden';
}
async function connect(){
  try{
    const {joinRoom}=await import('https://cdn.jsdelivr.net/npm/trystero@0.21.5/+esm');
    room=joinRoom({appId:'lol-flash-tracker-v1'},code);
    let gP,gF;
    [sPlayer,gP]=room.makeAction('player');
    [sFull,gF]=room.makeAction('full');
    gP(d=>mergePlayer(d.id,d));
    gF(d=>{Object.entries(d).forEach(([id,p])=>mergePlayer(id,p))});
    room.onPeerJoin(id=>{
      const all={};ROLES.forEach(([r])=>all[r]=toWire(players[r]));
      sFull(all,id);
      netStatus();
    });
    room.onPeerLeave(()=>netStatus());
    netStatus();
  }catch(e){netStatus(true);console.error(e)}
}
function mergePlayer(id,d){
  const p=players[id];
  if(p&&d.ts>p.ts){
    p.ins=d.ins;
    p.ready=d.rem===null?null:Date.now()+d.rem*1000;
    p.ts=d.ts;
    render();
  }
}

// ---------- Aktionen ----------
function setPlayer(id,patch){
  Object.assign(players[id],patch,{ts:Date.now()});
  sPlayer&&sPlayer({id,...toWire(players[id])});
  render();
}
const useFlash=id=>setPlayer(id,{ready:Date.now()+(players[id].ins?CD_INS:CD)*1000});
const resetFlash=id=>setPlayer(id,{ready:null});
const toggleIns=id=>setPlayer(id,{ins:!players[id].ins});

$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(location.href);$('copy').textContent='Kopiert'}
  catch{prompt('Einladungslink:',location.href)}
  setTimeout(()=>$('copy').textContent='Link kopieren',1500);
};
$('resetall').onclick=()=>ROLES.forEach(([id])=>resetFlash(id));
$('newsess').onclick=()=>{location.hash=rnd();location.reload()};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const m=e.code.match(/^(?:Digit|Numpad)([1-5])$/);
  if(!m)return;
  const id=ROLES[+m[1]-1][0];
  e.shiftKey?toggleIns(id):useFlash(id);
});

// ---------- Oberfläche ----------
const grid=$('grid');
ROLES.forEach(([id,name],i)=>{
  const c=document.createElement('article');
  c.className='card';c.id='c-'+id;
  c.innerHTML=`<header><h2>${name}</h2><kbd>${i+1}</kbd></header>
    <div class="ring"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="44"/><circle class="val" cx="50" cy="50" r="44"/></svg>
      <div class="mid"><strong></strong><span></span></div></div>
    <button class="use">Flash benutzt</button>
    <footer><label class="sw"><input type="checkbox"><i></i>Insight</label><button class="undo" title="Rückgängig" aria-label="${name}: Rückgängig">↺</button></footer>`;
  c.querySelector('.use').onclick=()=>useFlash(id);
  c.querySelector('input').onchange=()=>toggleIns(id);
  c.querySelector('.undo').onclick=()=>resetFlash(id);
  grid.append(c);
});
function render(){
  const now=Date.now();
  ROLES.forEach(([id])=>{
    const p=players[id],c=$('c-'+id);
    const total=p.ins?CD_INS:CD;
    const rem=p.ready===null?0:(p.ready-now)/1000;
    const s=rem<=0?'ready':rem<=SOON?'soon':'cd';
    c.dataset.s=s;
    c.querySelector('strong').textContent=s==='ready'?'Bereit':fmt(Math.ceil(rem));
    c.querySelector('.mid span').textContent=s==='ready'?'Flash verfügbar':'auf Cooldown';
    c.querySelector('.val').style.strokeDashoffset=s==='ready'?0:RING*(1-Math.min(1,rem/total));
    const cb=c.querySelector('input');
    if(cb.checked!==p.ins)cb.checked=p.ins;
  });
}
setInterval(render,250);
render();
connect();
</script>
</body>
</html>
