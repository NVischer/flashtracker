<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash-Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#010a13;--panel:#091428;--line:#463714;--gold:#c8aa6e;--tx:#f0e6d2;--mu:#8c8570;--ready:#0ac8b9;--cd:#e0463c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.4 Barlow,system-ui,sans-serif;padding:16px;max-width:1100px;margin-inline:auto}
h1{font:700 28px 'Barlow Condensed',sans-serif;letter-spacing:.04em;margin:0;color:var(--gold)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.net{color:var(--mu);font-size:14px}
.net b{color:var(--ready)}
button,input{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ready);outline-offset:2px}
input[type=text]{cursor:text;width:90px;text-align:center}
.clock{border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}
#time{font:700 72px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
#time.paused{color:var(--mu)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.primary{background:var(--gold);color:#010a13;border-color:var(--gold);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}#time{font-size:56px}}
.card{border:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--ready)}
.card.cd{border-top-color:var(--cd)}
.role{display:flex;justify-content:space-between;color:var(--gold);font:700 20px 'Barlow Condensed',sans-serif;letter-spacing:.04em}
.role kbd{color:var(--mu);font:500 14px Barlow,sans-serif}
.use{height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.use .big{font:700 40px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;color:var(--ready)}
.cd .use .big{color:var(--cd)}
.use small{color:var(--mu)}
.bar{height:4px;background:#1e2328}
.bar i{display:block;height:100%;width:0;background:var(--cd)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.row label{display:flex;gap:6px;align-items:center;cursor:pointer}
.row button{padding:4px 10px;font-size:13px}
.hint{color:var(--mu);font-size:14px;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>Flash-Tracker</h1>
  <div class="ctl">
    <span class="net" id="net">Verbinde …</span>
    <button id="copy">Einladungslink kopieren</button>
    <button id="newsess">Neue Session</button>
  </div>
</header>

<section class="clock" aria-label="Spielzeit">
  <div id="time" class="paused">0:00</div>
  <div class="ctl">
    <input type="text" id="set" placeholder="mm:ss" inputmode="numeric" aria-label="Spielzeit eingeben">
    <button class="primary" id="start">Start / Sync</button>
    <button id="minus">−1 s</button>
    <button id="plus">+1 s</button>
    <button id="pause">Pause</button>
  </div>
</section>

<main class="grid" id="grid"></main>

<p class="hint">Tasten 1–5: Flash benutzt (Top, Jungle, Mid, ADC, Support). Umschalt + 1–5: Cosmic Insight an/aus. Zum Synchronisieren die aktuelle Spielzeit eingeben (z. B. 4:32) und „Start / Sync“ drücken – das gilt dann für alle in der Session.</p>

<script>
const ROLES=[['top','Top'],['jgl','Jungle'],['mid','Mid'],['adc','ADC'],['sup','Support']];
const CD=300, CD_INS=250;

// ---------- Zustand ----------
let clock={running:false,t0:0,frozen:0}, clockTs=0;
const players={};
ROLES.forEach(([id])=>players[id]={ins:false,ready:null,ts:0});
const gameNow=()=>clock.running?(Date.now()-clock.t0)/1000:clock.frozen;
function applyClock(t,running){clock={running,frozen:t,t0:Date.now()-t*1000}}
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

// ---------- Netzwerk (Trystero, Peer-to-Peer, kein eigener Server) ----------
const $=id=>document.getElementById(id);
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
let code=location.hash.slice(1)||rnd();
history.replaceState(null,'','#'+code);
let sClock=null,sPlayer=null,sFull=null,room=null;

function netStatus(msg){
  if(msg){$('net').textContent=msg;return}
  const n=room?Object.keys(room.getPeers()).length:0;
  $('net').innerHTML='Session <b>'+code+'</b> · '+(n+1)+' verbunden';
}
async function connect(){
  try{
    const {joinRoom}=await import('https://cdn.jsdelivr.net/npm/trystero@0.21.5/+esm');
    room=joinRoom({appId:'lol-flash-tracker-v1'},code);
    let gC,gP,gF;
    [sClock,gC]=room.makeAction('clock');
    [sPlayer,gP]=room.makeAction('player');
    [sFull,gF]=room.makeAction('full');
    gC(d=>{if(d.ts>clockTs){clockTs=d.ts;applyClock(d.t,d.running);render()}});
    gP(d=>mergePlayer(d));
    gF(d=>{
      if(d.clock.ts>clockTs){clockTs=d.clock.ts;applyClock(d.clock.t,d.clock.running)}
      Object.entries(d.players).forEach(([id,p])=>mergePlayer({id,...p}));
      render();
    });
    room.onPeerJoin(id=>{
      sFull({clock:{t:gameNow(),running:clock.running,ts:clockTs},players},id);
      netStatus();
    });
    room.onPeerLeave(()=>netStatus());
    netStatus();
  }catch(e){
    netStatus('Offline – Sync nicht erreichbar');
    console.error(e);
  }
}
function mergePlayer(d){
  const p=players[d.id];
  if(p&&d.ts>p.ts){p.ins=d.ins;p.ready=d.ready;p.ts=d.ts;render()}
}

// ---------- Aktionen ----------
function setPlayer(id,patch){
  Object.assign(players[id],patch,{ts:Date.now()});
  sPlayer&&sPlayer({id,...players[id]});
  render();
}
function setClock(t,running){
  clockTs=Date.now();
  applyClock(t,running);
  sClock&&sClock({t,running,ts:clockTs});
  render();
}
const useFlash=id=>setPlayer(id,{ready:gameNow()+(players[id].ins?CD_INS:CD)});
const resetFlash=id=>setPlayer(id,{ready:null});
const toggleIns=id=>setPlayer(id,{ins:!players[id].ins});

function parseTime(v){
  const m=v.trim().match(/^(\d+):([0-5]?\d)$/);
  if(m)return +m[1]*60+ +m[2];
  return /^\d+$/.test(v.trim())?+v.trim():null;
}
$('start').onclick=()=>{
  const v=$('set').value;
  const t=v.trim()===''?(clock.running?gameNow():0):parseTime(v);
  if(t===null){$('set').focus();return}
  setClock(t,true);$('set').value='';
};
$('set').onkeydown=e=>{if(e.key==='Enter')$('start').click()};
$('minus').onclick=()=>setClock(Math.max(0,gameNow()-1),clock.running);
$('plus').onclick=()=>setClock(gameNow()+1,clock.running);
$('pause').onclick=()=>setClock(gameNow(),!clock.running);
$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(location.href);$('copy').textContent='Link kopiert'}
  catch{prompt('Einladungslink:',location.href)}
  setTimeout(()=>$('copy').textContent='Einladungslink kopieren',1500);
};
$('newsess').onclick=()=>{location.hash=rnd();location.reload()};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const m=e.code.match(/^(?:Digit|Numpad)([1-5])$/);
  if(!m)return;
  const id=ROLES[+m[1]-1][0];
  e.shiftKey?toggleIns(id):useFlash(id);
});

// ---------- Oberfläche ----------
const grid=$('grid');
ROLES.forEach(([id,name],i)=>{
  const c=document.createElement('div');
  c.className='card';c.id='c-'+id;
  c.innerHTML=`<div class="role"><span>${name}</span><kbd>${i+1}</kbd></div>
    <button class="use" aria-label="${name}: Flash benutzt"><span class="big"></span><small></small></button>
    <div class="bar"><i></i></div>
    <div class="row"><label><input type="checkbox"> Cosmic Insight</label><button>Zurück</button></div>`;
  c.querySelector('.use').onclick=()=>useFlash(id);
  c.querySelector('input').onchange=()=>toggleIns(id);
  c.querySelector('.row button').onclick=()=>resetFlash(id);
  grid.append(c);
});
function render(){
  const t=gameNow();
  const el=$('time');
  el.textContent=fmt(t);
  el.className=clock.running?'':'paused';
  $('pause').textContent=clock.running?'Pause':'Weiter';
  ROLES.forEach(([id])=>{
    const p=players[id],c=$('c-'+id);
    const rem=p.ready===null?0:p.ready-t;
    const cd=rem>0;
    c.classList.toggle('cd',cd);
    c.querySelector('.big').textContent=cd?fmt(Math.ceil(rem)):'Flash da';
    c.querySelector('small').textContent=cd?'wieder da um '+fmt(p.ready):'Klick = benutzt';
    c.querySelector('.bar i').style.width=cd?Math.min(100,rem/(p.ins?CD_INS:CD)*100)+'%':'0';
    const cb=c.querySelector('input');
    if(cb.checked!==p.ins)cb.checked=p.ins;
  });
}
setInterval(render,250);
render();
connect();
</script>
</body>
</html>
